[project]
name = "kaggle-lab"
version = "0.1.0"
description = "A reproducible experiment-tracking framework for Kaggle competitions: notebook runs with mandatory changelogs, auto-submit, score polling, and append-only parent→child run records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "kaggle>=2.0.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "papermill>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
]

[project.scripts]
kaggle-lab = "kaggle_lab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_lab"]
